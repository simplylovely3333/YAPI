<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Первый День В Нулевом Офисе</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell" aria-label="Первый День В Нулевом Офисе">
      <section class="topbar">
        <div>
          <p class="eyebrow">survival office horror</p>
          <h1>Первый День В Нулевом Офисе</h1>
        </div>
        <div class="status">
          <span id="act">Акт 1: Первый рабочий день</span>
          <span id="task">Задача: найдите свое рабочее место</span>
          <span id="badge">Пропуск: временный</span>
        </div>
      </section>

      <section class="game-wrap">
        <canvas id="game" width="960" height="600" aria-label="Игровое поле"></canvas>
        <aside class="panel">
          <div class="meters">
            <label>
              <span>Тревога</span>
              <meter id="fear" min="0" max="100" value="18"></meter>
            </label>
            <label>
              <span>Кофеин</span>
              <meter id="coffee" min="0" max="100" value="45"></meter>
            </label>
          </div>

          <div class="inventory" id="inventory" aria-label="Инвентарь"></div>

          <div class="log" id="log" aria-live="polite"></div>

          <div class="controls">
            <p><kbd>WASD</kbd> / <kbd>стрелки</kbd> движение</p>
            <p><kbd>E</kbd> говорить, брать, читать</p>
            <p><kbd>F</kbd> спрятаться / вылезти</p>
            <p><kbd>Shift</kbd> тихий шаг</p>
            <p><kbd>R</kbd> начать заново</p>
          </div>
        </aside>
      </section>

      <section class="dialogue" id="dialogue" hidden>
        <div>
          <p class="speaker" id="speaker"></p>
          <p id="line"></p>
        </div>
        <div class="choices" id="choices"></div>
      </section>
    </main>

    <script src="game.js"></script>
  </body>
</html>
