<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>STACK OVERFLOW</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell" aria-label="STACK OVERFLOW">
      <section class="topbar">
        <div>
          <p class="eyebrow">// nexcore terminal v2.31 — corrupted</p>
          <h1>STACK&nbsp;OVERFLOW</h1>
        </div>
        <div class="status">
          <span id="act">АКТ 1: First Commit</span>
          <span id="task">Задача: —</span>
          <span id="badge">JR. DEV / NexCore</span>
        </div>
      </section>

      <section class="game-wrap">
        <div class="frame">
          <div id="game"></div>
        </div>
        <aside class="panel">
          <div class="meters">
            <label>
              <span>Тревога</span>
              <meter id="fear" min="0" max="100" value="18"></meter>
            </label>
            <label>
              <span>Кофеин</span>
              <meter id="coffee" min="0" max="100" value="45"></meter>
            </label>
          </div>

          <div class="inventory" id="inventory" aria-label="Инвентарь"></div>

          <div class="log" id="log" aria-live="polite"></div>

          <div class="controls">
            <p><kbd>WASD</kbd> / <kbd>стрелки</kbd> движение</p>
            <p><kbd>E</kbd> / <kbd>Space</kbd> взаимодействие</p>
            <p><kbd>Esc</kbd> в меню</p>
          </div>
        </aside>
      </section>
    </main>

    <script src="https://unpkg.com/kaplay@3001.0.18/dist/kaplay.js"></script>
    <script src="game.js"></script>
  </body>
</html>
